<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache"><title>Дом</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#aaa8a3;color:#fff;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:300}*{-webkit-box-sizing:border-box;box-sizing:border-box}#screen{position:absolute;inset:0;background:#aaa8a3}.w{position:absolute;overflow:hidden;border-radius:13px;background:rgba(70,70,70,.14);border:1px solid rgba(255,255,255,.13)}#clockbox{left:2%;top:2%;width:55%;height:34%;background:transparent;border:0;padding-left:1%}#clock{font-size:19.5vw;line-height:.76;letter-spacing:-1vw;font-weight:200;white-space:nowrap}#date{font-size:2.25vw;margin-top:14px;white-space:nowrap}#calendar{left:2%;top:37%;width:55%;height:61%;padding:12px 16px}#calTitle{font-size:2.25vw;margin-bottom:6px}.cal{width:100%;border-collapse:collapse;text-align:center;font-size:1.65vw}.cal th{font-weight:300;opacity:.65;padding:3px}.cal td{height:5.2vh}.today{display:inline-block;background:#5588db;border-radius:50%;width:2.8vw;height:2.8vw;line-height:2.8vw}.holiday{position:absolute;left:16px;right:16px;bottom:8px;border-top:1px solid rgba(255,255,255,.14);padding-top:6px;font-size:1.15vw}.holiday b{font-size:1.45vw;font-weight:400}#weather{left:59%;top:2%;width:39%;height:32%;padding:13px 16px}#city{font-size:2.1vw;font-weight:400}.small{font-size:1.15vw;opacity:.7}#temp{font-size:6.2vw;line-height:1;margin:3px 0}#details{position:absolute;right:14px;top:52px;font-size:1.1vw;line-height:1.45}#sunmini{position:absolute;left:16px;right:14px;bottom:9px;font-size:.95vw;opacity:.8;white-space:nowrap}#sunmini span{margin-right:13px}#forecast{left:59%;top:36%;width:39%;height:20%;padding:8px 10px}#forecast h3{margin:0 0 3px;font-size:1.35vw;font-weight:400}.fd{float:left;width:20%;text-align:center;font-size:.9vw;border-left:1px solid rgba(255,255,255,.1);padding-top:2px}.fd:first-child{border:0}.ico{font-size:1.55vw;margin:2px 0}.hi{font-size:1.25vw}.lo{font-size:.9vw;opacity:.65}#photoWrap{left:59%;top:58%;width:39%;height:40%;padding:3px}#photo{width:100%;height:100%;object-fit:cover;border-radius:10px}.nav{position:absolute;top:43%;width:30px;height:48px;border:0;border-radius:15px;background:rgba(0,0,0,.2);color:white;font-size:25px;opacity:.65}.prev{left:8px}.next{right:8px}#gear{position:absolute;right:7px;bottom:7px;z-index:99;width:34px;height:34px;border:0;border-radius:50%;background:rgba(30,30,30,.22);color:#fff;font-size:17px}.handle{display:none;position:absolute;right:2px;bottom:2px;width:25px;height:25px;border-right:4px solid white;border-bottom:4px solid white;z-index:20}.editing .w{outline:2px dashed rgba(255,255,255,.8)}.editing .handle{display:block}.editing #tools{display:block}#tools{display:none;position:absolute;left:8px;bottom:7px;z-index:98;background:rgba(30,30,30,.8);padding:7px;border-radius:10px;font-size:11px}#tools button{height:30px;margin-right:6px;border:0;border-radius:7px;background:rgba(255,255,255,.2);color:#fff;padding:0 10px}</style></head><body><div id="screen"><div id="clockbox" class="w move"><div id="clock">--:--</div><div id="date"></div><i class="handle"></i></div><div id="calendar" class="w move"><div id="calTitle"></div><div id="calBody"></div><div class="holiday">Сегодня<br><b id="holiday">Праздников нет</b></div><i class="handle"></i></div><div id="weather" class="w move"><div id="city">Ханты-Мансийск</div><div class="small">Сейчас</div><div id="temp">--°</div><div id="feel" class="small"></div><div id="details"></div><div id="sunmini"><span>Восход <b id="rise">--:--</b></span><span>Закат <b id="set">--:--</b></span><span>День <b id="len">--</b></span></div><i class="handle"></i></div><div id="forecast" class="w move"><h3>Прогноз на 5 дней</h3><div id="days"></div><i class="handle"></i></div><div id="photoWrap" class="w move"><img id="photo" src="photos/photo1.jpg"><button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button><i class="handle"></i></div></div><button id="gear">⚙</button><div id="tools"><button id="done">Готово</button><button id="reset">Сбросить</button> Тяни блок • угол ↘ меняет размер</div><script>var M=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],MC=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],W=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];function p(n){return n<10?'0'+n:n}function cal(d){var y=d.getFullYear(),m=d.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),h='<table class="cal"><tr><th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Вс</th></tr><tr>',i;for(i=0;i<f;i++)h+='<td></td>';for(i=1;i<=n;i++){if((f+i-1)%7==0&&i>1)h+='</tr><tr>';h+='<td>'+(i==d.getDate()?'<span class="today">'+i+'</span>':i)+'</td>'}h+='</tr></table>';document.getElementById('calTitle').innerHTML=MC[m]+' '+y;document.getElementById('calBody').innerHTML=h;var q={'1-1':'Новый год','1-7':'Рождество Христово','2-23':'День защитника Отечества','3-8':'Международный женский день','5-1':'Праздник Весны и Труда','5-9':'День Победы','6-12':'День России','11-4':'День народного единства'};document.getElementById('holiday').innerHTML=q[(m+1)+'-'+d.getDate()]||'Праздников нет'}function tick(){var d=new Date();document.getElementById('clock').innerHTML=p(d.getHours())+':'+p(d.getMinutes());document.getElementById('date').innerHTML=W[d.getDay()]+', '+d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();cal(d)}tick();setInterval(tick,1000);function icon(c){if(c==0)return'☀️';if(c<=3)return'🌤️';if(c<=48)return'☁️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=82)return'🌦️';return'⛈️'}function render(j){try{var c=j.current,d=j.daily,t=Math.round(c.temperature_2m);document.getElementById('temp').innerHTML=icon(c.weather_code)+' '+t+'°';document.getElementById('feel').innerHTML='Ощущается '+Math.round(c.apparent_temperature)+'°';document.getElementById('details').innerHTML='Влажность '+c.relative_humidity_2m+' %<br>Ветер '+Math.round(c.wind_speed_10m)+' км/ч';var h='';for(var k=0;k<5;k++){var dt=new Date(d.time[k]+'T12:00:00');h+='<div class="fd"><div>'+(k==0?'Сегодня':W[dt.getDay()].substr(0,2))+'</div><div class="ico">'+icon(d.weather_code[k])+'</div><div class="hi">'+Math.round(d.temperature_2m_max[k])+'°</div><div class="lo">'+Math.round(d.temperature_2m_min[k])+'°</div></div>'}document.getElementById('days').innerHTML=h;var r=d.sunrise[0].substr(11,5),s=d.sunset[0].substr(11,5);document.getElementById('rise').innerHTML=r;document.getElementById('set').innerHTML=s;var a=r.split(':'),b=s.split(':'),z=(+b[0]*60 + +b[1])-(+a[0]*60 + +a[1]);document.getElementById('len').innerHTML=Math.floor(z/60)+'ч '+z%60+'м'}catch(e){}}function weather(){var x=new XMLHttpRequest();x.open('GET','weather.json?t='+new Date().getTime(),true);x.onreadystatechange=function(){if(x.readyState==4&&x.status==200){try{render(JSON.parse(x.responseText))}catch(e){}}};x.send()}weather();setInterval(weather,300000);var photos=[];for(var i=1;i<=8;i++)photos.push('photos/photo'+i+'.jpg');var pi=0,im=document.getElementById('photo');function show(n){pi=(n+photos.length)%photos.length;im.src=photos[pi]}document.getElementById('prev').onclick=function(e){e.stopPropagation();show(pi-1)};document.getElementById('next').onclick=function(e){e.stopPropagation();show(pi+1)};setInterval(function(){show(pi+1)},45000);var edit=false,act=null,resize=false,sx=0,sy=0,sl=0,st=0,sw=0,sh=0;function save(){var o={},es=document.querySelectorAll('.move');for(var i=0;i<es.length;i++)o[es[i].id]=[es[i].style.left,es[i].style.top,es[i].style.width,es[i].style.height];try{localStorage.setItem('ipadLayoutV8',JSON.stringify(o))}catch(e){}}function load(){try{var o=JSON.parse(localStorage.getItem('ipadLayoutV8')||'{}');for(var id in o){var e=document.getElementById(id);if(e){e.style.left=o[id][0];e.style.top=o[id][1];e.style.width=o[id][2];e.style.height=o[id][3]}}}catch(e){}}function start(e,x,y,r){if(!edit)return;act=e;resize=r;var q=e.getBoundingClientRect();sx=x;sy=y;sl=q.left;st=q.top;sw=q.width;sh=q.height}function drag(x,y){if(!act)return;var pw=window.innerWidth,ph=window.innerHeight,dx=x-sx,dy=y-sy;if(resize){act.style.width=Math.max(100,sw+dx)/pw*100+'%';act.style.height=Math.max(55,sh+dy)/ph*100+'%'}else{act.style.left=Math.max(0,Math.min(pw-sw,sl+dx))/pw*100+'%';act.style.top=Math.max(0,Math.min(ph-sh,st+dy))/ph*100+'%'}}function stop(){if(act){save();act=null}}var es=document.querySelectorAll('.move');for(i=0;i<es.length;i++){(function(e){e.ontouchstart=function(v){if(!edit)return;v.preventDefault();var t=v.touches[0];start(e,t.clientX,t.clientY,v.target.className=='handle')}})(es[i])}document.ontouchmove=function(v){if(act){v.preventDefault();drag(v.touches[0].clientX,v.touches[0].clientY)}};document.ontouchend=stop;document.getElementById('gear').onclick=function(){edit=!edit;document.body.className=edit?'editing':'';this.innerHTML=edit?'✓':'⚙'};document.getElementById('done').onclick=function(){edit=false;document.body.className='';document.getElementById('gear').innerHTML='⚙'};document.getElementById('reset').onclick=function(){try{localStorage.removeItem('ipadLayoutV8')}catch(e){}location.reload()};load();</script></body></html>
