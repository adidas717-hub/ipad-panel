html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#aaa8a3;color:#fff;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}#day{position:absolute;inset:0;padding:24px;background:#aaa8a3}#top{height:43%;display:flex;gap:20px}#clockbox{width:62%;display:flex;flex-direction:column;justify-content:center;padding-left:8px}#clock{font-size:175px;font-weight:200;line-height:.82;letter-spacing:-9px;font-variant-numeric:tabular-nums}#date{font-size:27px;font-weight:300;margin-top:27px;letter-spacing:-.4px}.card{background:rgba(70,72,74,.18);border:1px solid rgba(255,255,255,.13);border-radius:16px}#weather{width:38%;padding:20px}#city{font-size:22px;font-weight:500;letter-spacing:-.3px}.muted{opacity:.62;font-size:14px;font-weight:300}#temp{font-size:62px;font-weight:250;margin:7px 0 4px;letter-spacing:-2px}#desc{font-size:16px;font-weight:300}#details{font-size:15px;font-weight:300;line-height:1.5;margin-top:5px;opacity:.88}#bottom{height:46%;display:flex;gap:18px;margin-top:12px}#photoWrap{position:relative;width:46%;padding:7px;overflow:hidden;touch-action:pan-y}#photo{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block;-webkit-user-drag:none;user-select:none;transition:opacity .18s ease}.photoNav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:48px;border:0;border-radius:17px;background:rgba(0,0,0,.16);color:rgba(255,255,255,.8);font-size:27px;font-weight:200;line-height:44px;text-align:center;padding:0;opacity:.45}.photoNav:active{background:rgba(0,0,0,.30);opacity:.9}#prevPhoto{left:13px}#nextPhoto{right:13px}#photoDots{position:absolute;left:0;right:0;bottom:12px;text-align:center;height:8px}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);margin:0 3px}.dot.active{background:#fff}#forecast{width:54%;padding:14px}#forecast h3{margin:0 0 12px;font-size:18px;font-weight:400;letter-spacing:-.2px}#days{display:flex;height:78%}.day{flex:1;text-align:center;border-left:1px solid rgba(255,255,255,.10);font-size:14px;font-weight:300}.day:first-child{border:0}.icon{font-size:27px;margin:7px 0}.hi{font-size:22px;font-weight:400}.lo{font-size:16px;font-weight:300;opacity:.65;margin-top:4px}#footer{height:7%;margin-top:10px;display:flex;align-items:center;justify-content:space-around;font-size:14px;font-weight:300;opacity:.78}#footer b{font-weight:400}#night{display:none;position:absolute;inset:0;background:#000;color:#7c5438;align-items:center;justify-content:center;text-align:center}#nightClock{font-size:150px;font-weight:200;letter-spacing:-7px}#nightDate{font-size:24px;font-weight:300;margin-top:22px}#nightTemp{font-size:30px;font-weight:300;margin-top:28px}
@media screen and (orientation:landscape){#day{padding:10px 12px}#top{height:42%;gap:12px}#clockbox{width:61%;padding-left:14px}#clock{font-size:150px;font-weight:200;line-height:.72;letter-spacing:-8px}#date{font-size:20px;font-weight:300;margin-top:18px}#weather{width:39%;padding:11px 17px}#city{font-size:18px;font-weight:500}.muted{font-size:11px}#temp{font-size:51px;font-weight:250;margin:1px 0;letter-spacing:-1.5px}#desc{font-size:12px}#details{font-size:12px;line-height:1.22;margin-top:1px}#bottom{height:48%;gap:12px;margin-top:7px}#photoWrap{width:36%;padding:5px}#photo{border-radius:9px}#forecast{width:64%;padding:9px 11px}#forecast h3{font-size:15px;font-weight:400;margin:0 0 7px}#days{height:86%;align-items:stretch}.day{font-size:12px;padding-top:5px}.icon{font-size:25px;margin:8px 0}.hi{font-size:19px;font-weight:400}.lo{font-size:14px;margin-top:3px}.photoNav{width:30px;height:43px;font-size:24px;line-height:39px}.dot{width:4px;height:4px;margin:0 2px}#footer{height:6%;margin-top:5px;font-size:11px;border-radius:10px}#nightClock{font-size:125px}#nightDate{font-size:20px;margin-top:15px}#nightTemp{font-size:25px;margin-top:18px}}
</style></head><body><div id="day"><div id="top"><div id="clockbox"><div id="clock">--:--</div><div id="date"></div></div><div id="weather" class="card"><div id="city">Ханты-Мансийск</div><div class="muted">Сейчас</div><div id="temp">--°</div><div id="desc"></div><div id="details"></div></div></div><div id="bottom"><div id="photoWrap" class="card"><img id="photo" src="photos/photo1.jpg"><button id="prevPhoto" class="photoNav" aria-label="Предыдущее фото">‹</button><button id="nextPhoto" class="photoNav" aria-label="Следующее фото">›</button><div id="photoDots"></div></div><div id="forecast" class="card"><h3>Прогноз на 5 дней</h3><div id="days"></div></div></div><div id="footer" class="card"><span>Восход <b id="sunrise">--:--</b></span><span>Закат <b id="sunset">--:--</b></span><span>Световой день <b id="daylen">--</b></span></div></div><div id="night"><div><div id="nightClock">--:--</div><div id="nightDate"></div><div id="nightTemp">☾ &nbsp; --°</div></div></div><script>
var photos=[];for(var i=1;i<=8;i++)photos.push('photos/photo'+i+'.jpg');var pi=0,photoTimer=null;var photo=document.getElementById('photo'),wrap=document.getElementById('photoWrap'),dots=document.getElementById('photoDots');function drawDots(){var h='';for(var i=0;i<photos.length;i++)h+='<span class="dot'+(i===pi?' active':'')+'"></span>';dots.innerHTML=h}function showPhoto(n){pi=(n+photos.length)%photos.length;photo.style.opacity='.25';setTimeout(function(){photo.src=photos[pi];photo.style.opacity='1';drawDots()},90)}function nextPhoto(){showPhoto(pi+1);resetPhotoTimer()}function prevPhoto(){showPhoto(pi-1);resetPhotoTimer()}function resetPhotoTimer(){if(photoTimer)clearInterval(photoTimer);photoTimer=setInterval(function(){showPhoto(pi+1)},45000)}document.getElementById('nextPhoto').onclick=function(e){e.preventDefault();nextPhoto()};document.getElementById('prevPhoto').onclick=function(e){e.preventDefault();prevPhoto()};var sx=0,sy=0;wrap.addEventListener('touchstart',function(e){if(e.touches&&e.touches.length){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},false);wrap.addEventListener('touchend',function(e){if(!e.changedTouches||!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){if(dx<0)nextPhoto();else prevPhoto()}},false);drawDots();resetPhotoTimer();
var months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];var weekdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];function pad(n){return n<10?'0'+n:n}function updateClock(){var d=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes()),ds=weekdays[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();document.getElementById('clock').innerHTML=t;document.getElementById('date').innerHTML=ds;document.getElementById('nightClock').innerHTML=t;document.getElementById('nightDate').innerHTML=ds;var n=d.getHours()>=22||d.getHours()<7;document.getElementById('day').style.display=n?'none':'block';document.getElementById('night').style.display=n?'flex':'none'}setInterval(updateClock,1000);updateClock();function codeIcon(c){if(c==0)return'☀️';if(c<=3)return'🌤️';if(c<=48)return'☁️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=82)return'🌦️';return'⛈️'}function render(j){try{var c=j.current,d=j.daily,temp=Math.round(c.temperature_2m);document.getElementById('temp').innerHTML=codeIcon(c.weather_code)+' '+temp+'°';document.getElementById('nightTemp').innerHTML='☾ &nbsp; '+temp+'°';document.getElementById('desc').innerHTML='Ощущается '+Math.round(c.apparent_temperature)+'°';document.getElementById('details').innerHTML='Влажность&nbsp;&nbsp; '+c.relative_humidity_2m+' %<br>Ветер&nbsp;&nbsp; '+Math.round(c.wind_speed_10m)+' км/ч';var h='';for(var k=0;k<5;k++){var dt=new Date(d.time[k]+'T12:00:00');h+='<div class="day"><div>'+(k==0?'Сегодня':weekdays[dt.getDay()].substr(0,2))+'</div><div class="icon">'+codeIcon(d.weather_code[k])+'</div><div class="hi">'+Math.round(d.temperature_2m_max[k])+'°</div><div class="lo">'+Math.round(d.temperature_2m_min[k])+'°</div></div>'}document.getElementById('days').innerHTML=h;var sr=d.sunrise[0].substr(11,5),ss=d.sunset[0].substr(11,5);document.getElementById('sunrise').innerHTML=sr;document.getElementById('sunset').innerHTML=ss;var a=d.sunrise[0].split('T')[1].split(':'),b=d.sunset[0].split('T')[1].split(':'),m=(+b[0]*60 + +b[1])-(+a[0]*60 + +a[1]);document.getElementById('daylen').innerHTML=Math.floor(m/60)+' ч '+(m%60)+' мин'}catch(e){}}function fetchWeather(){var x=new XMLHttpRequest();var url='https://adidas717-hub.github.io/ipad-panel/weather.json?v='+(new Date().getTime());x.open('GET',url,true);x.setRequestHeader('Cache-Control','no-cache');x.onreadystatechange=function(){if(x.readyState===4&&x.status>=200&&x.status<300){try{render(JSON.parse(x.responseText))}catch(e){}}};x.send(null)}fetchWeather();setTimeout(fetchWeather,3000);setInterval(fetchWeather,300000);document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(fetchWeather,500)});window.addEventListener('pageshow',function(){setTimeout(fetchWeather,500)});
</script></body></html>
