<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><title>Дом</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#aaa8a3;color:#fff;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}#day{position:absolute;inset:0;background:#a9a7a2;overflow:hidden}.widget{position:absolute;background:rgba(65,67,69,.14);border:1px solid rgba(255,255,255,.11);border-radius:14px;overflow:hidden}.plain{background:transparent;border-color:transparent}.handle{display:none;position:absolute;right:3px;bottom:3px;width:22px;height:22px;border-right:3px solid rgba(255,255,255,.8);border-bottom:3px solid rgba(255,255,255,.8);z-index:30}.edit .widget{outline:1px dashed rgba(255,255,255,.8)}.edit .handle{display:block}.edit .widget:before{content:'✥';position:absolute;right:5px;top:3px;z-index:30;font-size:15px;opacity:.7}#clockBox{left:2%;top:3%;width:50%;height:31%;padding:8px 12px;display:flex;flex-direction:column;justify-content:center}#clock{font-size:18vw;font-weight:200;line-height:.72;letter-spacing:-1vw;white-space:nowrap}#date{font-size:2.35vw;font-weight:300;margin-top:18px;white-space:nowrap}#calendar{left:2%;top:36%;width:50%;height:55%;padding:10px 15px}.calHead{font-size:2.1vw;margin-bottom:5px}.calWeek,.calGrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.calWeek{font-size:1.25vw;opacity:.7;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.12)}.calGrid{font-size:1.55vw;line-height:1.72}.sun{color:#ff7373}.sat{color:#6ea8ff}.today{display:inline-flex;align-items:center;justify-content:center;background:#4c86e8;border-radius:50%;width:2.65vw;height:2.65vw}.holiday{position:absolute;left:0;right:0;bottom:0;height:18%;border-top:1px solid rgba(255,255,255,.12);padding:6px 15px;font-size:1.25vw;display:flex;align-items:center}.holiday b{display:block;font-size:1.5vw;font-weight:400}.holidayIcon{font-size:2vw;margin-right:10px}#weather{left:54%;top:3%;width:44%;height:29%;padding:12px 16px}#city{font-size:2vw;font-weight:500}.muted{font-size:1.15vw;opacity:.65}#temp{font-size:5.8vw;font-weight:200;line-height:1;margin:4px 0}#desc,#details{font-size:1.25vw;font-weight:300;line-height:1.35}#details{position:absolute;right:12px;top:44px}#forecast{left:54%;top:34%;width:44%;height:26%;padding:8px 10px}#forecast h3{margin:0 0 4px;font-size:1.55vw;font-weight:400}#days{display:flex;height:76%;align-items:center}.day{flex:1;text-align:center;border-left:1px solid rgba(255,255,255,.09);font-size:1vw}.day:first-child{border:0}.icon{font-size:2vw;margin:2px 0}.hi{font-size:1.55vw}.lo{font-size:1.1vw;opacity:.65}#photoWrap{left:54%;top:62%;width:44%;height:27%;padding:3px;touch-action:none}#photo{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block;transition:opacity .18s}.photoNav{position:absolute;top:50%;transform:translateY(-50%);width:27px;height:38px;border:0;border-radius:15px;background:rgba(0,0,0,.18);color:#fff;font-size:22px;opacity:.5}#prevPhoto{left:8px}#nextPhoto{right:8px}#photoDots{position:absolute;left:0;right:0;bottom:8px;text-align:center}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);margin:0 3px}.dot.active{background:#fff}#footer{left:54%;top:91%;width:44%;height:7%;display:flex;align-items:center;justify-content:space-around;font-size:1vw;font-weight:300}#editBtn{position:fixed;right:8px;bottom:8px;z-index:100;width:38px;height:38px;border:0;border-radius:19px;background:rgba(25,25,25,.25);color:#fff;font-size:18px;opacity:.3}#editPanel{display:none;position:fixed;left:8px;right:8px;bottom:8px;height:50px;z-index:90;background:rgba(30,30,30,.78);border-radius:13px;padding:6px 54px 6px 8px;align-items:center;gap:7px}.edit #editPanel{display:flex}.tool{height:36px;border:0;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;padding:0 10px;font-size:12px}#night{display:none;position:absolute;inset:0;background:#000;color:#7c5438;align-items:center;justify-content:center;text-align:center}#nightClock{font-size:20vw;font-weight:200}#nightDate{font-size:2.5vw;margin-top:18px}#nightTemp{font-size:3vw;margin-top:20px}@media (orientation:portrait){#clock{font-size:24vw}#date{font-size:3vw}.calGrid{font-size:2vw}}
</style></head><body><div id="day"><div id="clockBox" class="widget plain movable"><div id="clock">--:--</div><div id="date"></div><i class="handle"></i></div><div id="calendar" class="widget movable"><div class="calHead" id="calTitle"></div><div class="calWeek"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span class="sat">Сб</span><span class="sun">Вс</span></div><div class="calGrid" id="calGrid"></div><div class="holiday"><span class="holidayIcon">▣</span><span><small>Сегодня</small><b id="holidayText">Праздников нет</b></span></div><i class="handle"></i></div><div id="weather" class="widget movable"><div id="city">Ханты-Мансийск</div><div class="muted">Сейчас</div><div id="temp">--°</div><div id="desc"></div><div id="details"></div><i class="handle"></i></div><div id="forecast" class="widget movable"><h3>Прогноз на 5 дней</h3><div id="days"></div><i class="handle"></i></div><div id="photoWrap" class="widget movable"><img id="photo" src="photos/photo1.jpg"><button id="prevPhoto" class="photoNav">‹</button><button id="nextPhoto" class="photoNav">›</button><div id="photoDots"></div><i class="handle"></i></div><div id="footer" class="widget movable"><span>Восход <b id="sunrise">--:--</b></span><span>Закат <b id="sunset">--:--</b></span><span>Световой день <b id="daylen">--</b></span><i class="handle"></i></div></div><button id="editBtn">⚙</button><div id="editPanel"><button class="tool" id="doneBtn">Готово</button><button class="tool" id="resetBtn">Сбросить макет</button><span style="font-size:11px;opacity:.8">Тяни блок за любое место • размер — за угол ↘ • настройки сохраняются на iPad</span></div><div id="night"><div><div id="nightClock">--:--</div><div id="nightDate"></div><div id="nightTemp">☾ &nbsp; --°</div></div></div><script>
var photos=[];for(var i=1;i<=8;i++)photos.push('photos/photo'+i+'.jpg');var pi=0,photoTimer=null,photo=document.getElementById('photo'),wrap=document.getElementById('photoWrap'),dots=document.getElementById('photoDots');function drawDots(){var h='';for(var i=0;i<photos.length;i++)h+='<span class="dot'+(i===pi?' active':'')+'"></span>';dots.innerHTML=h}function showPhoto(n){pi=(n+photos.length)%photos.length;photo.style.opacity='.25';setTimeout(function(){photo.src=photos[pi];photo.style.opacity='1';drawDots()},90)}function resetPhotoTimer(){if(photoTimer)clearInterval(photoTimer);photoTimer=setInterval(function(){showPhoto(pi+1)},45000)}function nextPhoto(){showPhoto(pi+1);resetPhotoTimer()}function prevPhoto(){showPhoto(pi-1);resetPhotoTimer()}document.getElementById('nextPhoto').onclick=function(e){e.stopPropagation();nextPhoto()};document.getElementById('prevPhoto').onclick=function(e){e.stopPropagation();prevPhoto()};drawDots();resetPhotoTimer();
var months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],monthsCap=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],weekdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];function pad(n){return n<10?'0'+n:n}function makeCalendar(d){document.getElementById('calTitle').innerHTML=monthsCap[d.getMonth()]+' <span style="font-weight:300">'+d.getFullYear()+'</span>';var y=d.getFullYear(),m=d.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate(),h='';for(var x=0;x<first;x++)h+='<span></span>';for(var n=1;n<=total;n++){var dow=(first+n-1)%7,cl=dow==5?'sat':dow==6?'sun':'';if(n==d.getDate())h+='<span class="'+cl+'"><i class="today">'+n+'</i></span>';else h+='<span class="'+cl+'">'+n+'</span>'}document.getElementById('calGrid').innerHTML=h;var fixed={'1-1':'Новый год','1-7':'Рождество Христово','2-23':'День защитника Отечества','3-8':'Международный женский день','5-1':'Праздник Весны и Труда','5-9':'День Победы','6-12':'День России','11-4':'День народного единства'};document.getElementById('holidayText').innerHTML=fixed[(m+1)+'-'+d.getDate()]||'Праздников нет'}function updateClock(){var d=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes()),ds=weekdays[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();document.getElementById('clock').innerHTML=t;document.getElementById('date').innerHTML=ds;document.getElementById('nightClock').innerHTML=t;document.getElementById('nightDate').innerHTML=ds;makeCalendar(d);var n=d.getHours()>=22||d.getHours()<7;if(!document.body.classList.contains('edit')){document.getElementById('day').style.display=n?'none':'block';document.getElementById('night').style.display=n?'flex':'none'}}setInterval(updateClock,1000);updateClock();function codeIcon(c){if(c==0)return'☀️';if(c<=3)return'🌤️';if(c<=48)return'☁️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=82)return'🌦️';return'⛈️'}function render(j){try{var c=j.current,d=j.daily,temp=Math.round(c.temperature_2m);document.getElementById('temp').innerHTML=codeIcon(c.weather_code)+' '+temp+'°';document.getElementById('nightTemp').innerHTML='☾ &nbsp; '+temp+'°';document.getElementById('desc').innerHTML='Ощущается '+Math.round(c.apparent_temperature)+'°';document.getElementById('details').innerHTML='Влажность '+c.relative_humidity_2m+' %<br>Ветер '+Math.round(c.wind_speed_10m)+' км/ч';var h='';for(var k=0;k<5;k++){var dt=new Date(d.time[k]+'T12:00:00');h+='<div class="day"><div>'+(k==0?'Сегодня':weekdays[dt.getDay()].substr(0,2))+'</div><div class="icon">'+codeIcon(d.weather_code[k])+'</div><div class="hi">'+Math.round(d.temperature_2m_max[k])+'°</div><div class="lo">'+Math.round(d.temperature_2m_min[k])+'°</div></div>'}document.getElementById('days').innerHTML=h;var sr=d.sunrise[0].substr(11,5),ss=d.sunset[0].substr(11,5);document.getElementById('sunrise').innerHTML=sr;document.getElementById('sunset').innerHTML=ss;var a=d.sunrise[0].split('T')[1].split(':'),b=d.sunset[0].split('T')[1].split(':'),mins=(+b[0]*60 + +b[1])-(+a[0]*60 + +a[1]);document.getElementById('daylen').innerHTML=Math.floor(mins/60)+' ч '+(mins%60)+' мин'}catch(e){}}function fetchWeather(){var x=new XMLHttpRequest();x.open('GET','weather.json?v='+(new Date().getTime()),true);x.onreadystatechange=function(){if(x.readyState===4&&x.status>=200&&x.status<300){try{render(JSON.parse(x.responseText))}catch(e){}}};x.send(null)}fetchWeather();setTimeout(fetchWeather,2500);setInterval(fetchWeather,300000);
var edit=false,active=null,mode='',sx=0,sy=0,sl=0,st=0,sw=0,sh=0;function saveLayout(){var o={};var ws=document.querySelectorAll('.movable');for(var i=0;i<ws.length;i++){var e=ws[i];o[e.id]={l:e.style.left,t:e.style.top,w:e.style.width,h:e.style.height}}try{localStorage.setItem('ipadLayoutV6',JSON.stringify(o))}catch(x){}}function loadLayout(){try{var o=JSON.parse(localStorage.getItem('ipadLayoutV6')||'{}');for(var id in o){var e=document.getElementById(id);if(e){e.style.left=o[id].l;e.style.top=o[id].t;e.style.width=o[id].w;e.style.height=o[id].h}}}catch(x){}}function pos(e){var r=e.getBoundingClientRect(),p=document.getElementById('day').getBoundingClientRect();return{l:r.left-p.left,t:r.top-p.top,w:r.width,h:r.height,pw:p.width,ph:p.height}}function begin(e,resize,x,y){if(!edit)return;active=e;mode=resize?'resize':'move';var q=pos(e);sx=x;sy=y;sl=q.l;st=q.t;sw=q.w;sh=q.h}function move(x,y){if(!active)return;var p=document.getElementById('day').getBoundingClientRect(),dx=x-sx,dy=y-sy;if(mode==='move'){var l=Math.max(0,Math.min(p.width-sw,sl+dx)),t=Math.max(0,Math.min(p.height-sh,st+dy));active.style.left=(l/p.width*100)+'%';active.style.top=(t/p.height*100)+'%'}else{var w=Math.max(100,Math.min(p.width-sl,sw+dx)),h=Math.max(55,Math.min(p.height-st,sh+dy));active.style.width=(w/p.width*100)+'%';active.style.height=(h/p.height*100)+'%'}}function end(){if(active){saveLayout();active=null}}var ws=document.querySelectorAll('.movable');for(var z=0;z<ws.length;z++){(function(e){e.addEventListener('touchstart',function(ev){if(!edit)return;ev.preventDefault();var t=ev.touches[0],isH=ev.target.className==='handle';begin(e,isH,t.clientX,t.clientY)},false);e.addEventListener('mousedown',function(ev){if(!edit)return;ev.preventDefault();begin(e,ev.target.className==='handle',ev.clientX,ev.clientY)},false)})(ws[z])}document.addEventListener('touchmove',function(ev){if(active){ev.preventDefault();move(ev.touches[0].clientX,ev.touches[0].clientY)}},false);document.addEventListener('touchend',end,false);document.addEventListener('mousemove',function(ev){move(ev.clientX,ev.clientY)},false);document.addEventListener('mouseup',end,false);function setEdit(v){edit=v;document.body.className=v?'edit':'';document.getElementById('day').style.display='block';document.getElementById('night').style.display='none';document.getElementById('editBtn').innerHTML=v?'✓':'⚙'}document.getElementById('editBtn').onclick=function(){setEdit(!edit)};document.getElementById('doneBtn').onclick=function(){setEdit(false);updateClock()};document.getElementById('resetBtn').onclick=function(){try{localStorage.removeItem('ipadLayoutV6')}catch(x){}location.reload()};loadLayout();
</script></body></html>
