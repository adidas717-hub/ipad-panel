<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><title>Дом</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#aaa8a3;color:white}*{box-sizing:border-box}#day{position:absolute;inset:0;padding:24px;background:#aaa8a3}#top{height:43%;display:flex;gap:20px}#clockbox{width:62%;display:flex;flex-direction:column;justify-content:center;padding-left:8px}#clock{font-size:175px;font-weight:650;line-height:.82;letter-spacing:-10px}#date{font-size:28px;margin-top:27px}.card{background:rgba(70,72,74,.20);border:1px solid rgba(255,255,255,.14);border-radius:16px}#weather{width:38%;padding:20px}#city{font-size:22px}.muted{opacity:.65;font-size:15px}#temp{font-size:58px;font-weight:600;margin:8px 0 5px}#desc{font-size:17px}#details{font-size:16px;line-height:1.55;margin-top:5px}#bottom{height:46%;display:flex;gap:18px;margin-top:12px}#photoWrap{width:46%;padding:7px;overflow:hidden}#photo{width:100%;height:100%;object-fit:cover;border-radius:11px}#forecast{width:54%;padding:14px}#forecast h3{margin:0 0 12px;font-size:19px;font-weight:500}#days{display:flex;height:78%}.day{flex:1;text-align:center;border-left:1px solid rgba(255,255,255,.11);font-size:15px}.day:first-child{border:0}.icon{font-size:28px;margin:7px 0}.hi{font-size:23px;font-weight:600}.lo{font-size:17px;opacity:.72;margin-top:4px}#footer{height:7%;margin-top:10px;display:flex;align-items:center;justify-content:space-around;font-size:15px;opacity:.85}#night{display:none;position:absolute;inset:0;background:#000;color:#7c5438;align-items:center;justify-content:center;text-align:center}#nightClock{font-size:150px;font-weight:600}#nightDate{font-size:25px;margin-top:22px}#nightTemp{font-size:30px;margin-top:28px}</style></head><body><div id="day"><div id="top"><div id="clockbox"><div id="clock">--:--</div><div id="date"></div></div><div id="weather" class="card"><div id="city">Ханты-Мансийск</div><div class="muted">Сейчас</div><div id="temp">--°</div><div id="desc"></div><div id="details"></div></div></div><div id="bottom"><div id="photoWrap" class="card"><img id="photo" src="photos/photo1.jpg"></div><div id="forecast" class="card"><h3>Прогноз на 5 дней</h3><div id="days"></div></div></div><div id="footer" class="card"><span>Восход <b id="sunrise">--:--</b></span><span>Закат <b id="sunset">--:--</b></span><span>Световой день <b id="daylen">--</b></span></div></div><div id="night"><div><div id="nightClock">--:--</div><div id="nightDate"></div><div id="nightTemp">☾ &nbsp; --°</div></div></div><script>var photos=[];for(var i=1;i<=8;i++)photos.push('photos/photo'+i+'.jpg');var pi=0;var months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];var weekdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];function pad(n){return n<10?'0'+n:n}function updateClock(){var d=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes()),ds=weekdays[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();document.getElementById('clock').innerHTML=t;document.getElementById('date').innerHTML=ds;document.getElementById('nightClock').innerHTML=t;document.getElementById('nightDate').innerHTML=ds;var n=d.getHours()>=22||d.getHours()<7;document.getElementById('day').style.display=n?'none':'block';document.getElementById('night').style.display=n?'flex':'none'}setInterval(updateClock,1000);updateClock();setInterval(function(){pi=(pi+1)%photos.length;document.getElementById('photo').src=photos[pi]},45000);function codeIcon(c){if(c==0)return'☀️';if(c<=3)return'🌤️';if(c<=48)return'☁️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=82)return'🌦️';return'⛈️'}function render(j){try{var c=j.current,d=j.daily,temp=Math.round(c.temperature_2m);document.getElementById('temp').innerHTML=codeIcon(c.weather_code)+' '+temp+'°';document.getElementById('nightTemp').innerHTML='☾ &nbsp; '+temp+'°';document.getElementById('desc').innerHTML='Ощущается '+Math.round(c.apparent_temperature)+'°';document.getElementById('details').innerHTML='Влажность&nbsp;&nbsp; '+c.relative_humidity_2m+' %<br>Ветер&nbsp;&nbsp; '+Math.round(c.wind_speed_10m)+' км/ч';var h='';for(var k=0;k<5;k++){var dt=new Date(d.time[k]+'T12:00:00');h+='<div class="day"><div>'+(k==0?'Сегодня':weekdays[dt.getDay()].substr(0,2))+'</div><div class="icon">'+codeIcon(d.weather_code[k])+'</div><div class="hi">'+Math.round(d.temperature_2m_max[k])+'°</div><div class="lo">'+Math.round(d.temperature_2m_min[k])+'°</div></div>'}document.getElementById('days').innerHTML=h;var sr=d.sunrise[0].substr(11,5),ss=d.sunset[0].substr(11,5);document.getElementById('sunrise').innerHTML=sr;document.getElementById('sunset').innerHTML=ss;var a=d.sunrise[0].split('T')[1].split(':'),b=d.sunset[0].split('T')[1].split(':'),m=(+b[0]*60 + +b[1])-(+a[0]*60 + +a[1]);document.getElementById('daylen').innerHTML=Math.floor(m/60)+' ч '+(m%60)+' мин'}catch(e){}}function fetchWeather(){var x=new XMLHttpRequest();var url='https://adidas717-hub.github.io/ipad-panel/weather.json?v='+(new Date().getTime());x.open('GET',url,true);x.setRequestHeader('Cache-Control','no-cache');x.onreadystatechange=function(){if(x.readyState===4&&x.status>=200&&x.status<300){try{render(JSON.parse(x.responseText))}catch(e){}}};x.send(null)}fetchWeather();setTimeout(fetchWeather,3000);setInterval(fetchWeather,300000);document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(fetchWeather,500)});window.addEventListener('pageshow',function(){setTimeout(fetchWeather,500)});</script></body></html>
