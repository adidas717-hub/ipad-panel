<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><title>Дом</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#aaa8a3;color:#fff;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}#day{position:absolute;inset:0;padding:18px}.card{background:rgba(65,67,69,.14);border:1px solid rgba(255,255,255,.11);border-radius:16px}#top{height:45%;display:flex;gap:14px}#clockbox{width:60%;display:flex;flex-direction:column;justify-content:center}#clock{font-size:170px;font-weight:200;line-height:.78;letter-spacing:-9px}#date{font-size:24px;font-weight:300;margin-top:25px}#weather{width:40%;padding:18px}#city{font-size:20px;font-weight:500}.muted{font-size:12px;opacity:.6}#temp{font-size:64px;font-weight:200;margin:7px 0}#desc,#details{font-size:14px;font-weight:300;line-height:1.4}#bottom{height:44%;display:flex;gap:14px;margin-top:10px}#photoWrap{position:relative;width:40%;padding:5px;overflow:hidden;touch-action:pan-y}#photo{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block;transition:opacity .18s}.photoNav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:44px;border:0;border-radius:15px;background:rgba(0,0,0,.14);color:#fff;font-size:25px;opacity:.4}#prevPhoto{left:10px}#nextPhoto{right:10px}#photoDots{position:absolute;left:0;right:0;bottom:10px;text-align:center}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);margin:0 3px}.dot.active{background:#fff}#forecast{width:60%;padding:12px}#forecast h3{margin:0 0 8px;font-size:16px;font-weight:400}#days{display:flex;height:80%;align-items:center}.day{flex:1;text-align:center;border-left:1px solid rgba(255,255,255,.09);font-size:13px;font-weight:300}.day:first-child{border:0}.icon{font-size:25px;margin:7px 0}.hi{font-size:20px}.lo{font-size:14px;opacity:.65}#footer{height:7%;margin-top:8px;display:flex;align-items:center;justify-content:space-around;font-size:12px;font-weight:300;opacity:.72}#night{display:none;position:absolute;inset:0;background:#000;color:#7c5438;align-items:center;justify-content:center;text-align:center}#nightClock{font-size:150px;font-weight:200}#nightDate{font-size:22px;margin-top:18px}#nightTemp{font-size:28px;margin-top:22px}
@media screen and (orientation:landscape){#day{padding:10px 12px;background:#a9a7a2;display:grid!important;grid-template-columns:54% 46%;grid-template-rows:58% 35% 7%;gap:7px 9px}#top,#bottom{display:contents}#clockbox{grid-column:1;grid-row:1;width:auto;height:auto;padding:8px 8px 8px 14px;justify-content:center;overflow:hidden}#clock{font-size:190px;font-weight:200;line-height:.76;letter-spacing:-11px;white-space:nowrap}#date{font-size:21px;margin-top:26px;white-space:nowrap}#weather{grid-column:2;grid-row:1;width:auto;height:auto;padding:15px 18px;border-radius:16px}#city{font-size:20px}.muted{font-size:11px}#temp{font-size:74px;line-height:1;margin:8px 0 6px}#desc{font-size:14px}#details{font-size:13px;line-height:1.35;margin-top:5px}#photoWrap{grid-column:1;grid-row:2;width:48%;height:auto;justify-self:start;padding:3px;border-radius:12px;overflow:hidden}#photo{width:100%;height:100%;object-fit:cover;border-radius:9px}#forecast{grid-column:1;grid-row:2;width:50%;height:auto;justify-self:end;padding:7px 8px;border-radius:12px;position:static}#forecast h3{font-size:13px;margin:0 0 2px}#days{height:82%}.day{font-size:9px}.icon{font-size:18px;margin:2px 0}.hi{font-size:15px}.lo{font-size:11px}.photoNav{width:24px;height:34px;font-size:19px}#footer{grid-column:2;grid-row:2 / 4;width:auto;height:auto;margin:0;padding:0 7px;border-radius:12px;font-size:10px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:12px}#nightClock{font-size:145px}}
</style></head><body><div id="day"><div id="top"><div id="clockbox"><div id="clock">--:--</div><div id="date"></div></div><div id="weather" class="card"><div id="city">Ханты-Мансийск</div><div class="muted">Сейчас</div><div id="temp">--°</div><div id="desc"></div><div id="details"></div></div></div><div id="bottom"><div id="photoWrap" class="card"><img id="photo" src="photos/photo1.jpg"><button id="prevPhoto" class="photoNav">‹</button><button id="nextPhoto" class="photoNav">›</button><div id="photoDots"></div></div><div id="forecast" class="card"><h3>Прогноз на 5 дней</h3><div id="days"></div></div></div><div id="footer" class="card"><span>Восход <b id="sunrise">--:--</b></span><span>Закат <b id="sunset">--:--</b></span><span>Световой день <b id="daylen">--</b></span></div></div><div id="night"><div><div id="nightClock">--:--</div><div id="nightDate"></div><div id="nightTemp">☾ &nbsp; --°</div></div></div><script>
var photos=[];for(var i=1;i<=8;i++)photos.push('photos/photo'+i+'.jpg');var pi=0,photoTimer=null,photo=document.getElementById('photo'),wrap=document.getElementById('photoWrap'),dots=document.getElementById('photoDots');function drawDots(){var h='';for(var i=0;i<photos.length;i++)h+='<span class="dot'+(i===pi?' active':'')+'"></span>';dots.innerHTML=h}function showPhoto(n){pi=(n+photos.length)%photos.length;photo.style.opacity='.25';setTimeout(function(){photo.src=photos[pi];photo.style.opacity='1';drawDots()},90)}function resetPhotoTimer(){if(photoTimer)clearInterval(photoTimer);photoTimer=setInterval(function(){showPhoto(pi+1)},45000)}function nextPhoto(){showPhoto(pi+1);resetPhotoTimer()}function prevPhoto(){showPhoto(pi-1);resetPhotoTimer()}document.getElementById('nextPhoto').onclick=nextPhoto;document.getElementById('prevPhoto').onclick=prevPhoto;var sx=0,sy=0;wrap.addEventListener('touchstart',function(e){if(e.touches.length){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},false);wrap.addEventListener('touchend',function(e){if(!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){dx<0?nextPhoto():prevPhoto()}},false);drawDots();resetPhotoTimer();
var months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],weekdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];function pad(n){return n<10?'0'+n:n}function updateClock(){var d=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes()),ds=weekdays[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();document.getElementById('clock').innerHTML=t;document.getElementById('date').innerHTML=ds;document.getElementById('nightClock').innerHTML=t;document.getElementById('nightDate').innerHTML=ds;var n=d.getHours()>=22||d.getHours()<7;document.getElementById('day').style.display=n?'none':'block';document.getElementById('night').style.display=n?'flex':'none'}setInterval(updateClock,1000);updateClock();function codeIcon(c){if(c==0)return'☀️';if(c<=3)return'🌤️';if(c<=48)return'☁️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=82)return'🌦️';return'⛈️'}function render(j){try{var c=j.current,d=j.daily,temp=Math.round(c.temperature_2m);document.getElementById('temp').innerHTML=codeIcon(c.weather_code)+' '+temp+'°';document.getElementById('nightTemp').innerHTML='☾ &nbsp; '+temp+'°';document.getElementById('desc').innerHTML='Ощущается '+Math.round(c.apparent_temperature)+'°';document.getElementById('details').innerHTML='Влажность&nbsp;&nbsp; '+c.relative_humidity_2m+' %<br>Ветер&nbsp;&nbsp; '+Math.round(c.wind_speed_10m)+' км/ч';var h='';for(var k=0;k<5;k++){var dt=new Date(d.time[k]+'T12:00:00');h+='<div class="day"><div>'+(k==0?'Сегодня':weekdays[dt.getDay()].substr(0,2))+'</div><div class="icon">'+codeIcon(d.weather_code[k])+'</div><div class="hi">'+Math.round(d.temperature_2m_max[k])+'°</div><div class="lo">'+Math.round(d.temperature_2m_min[k])+'°</div></div>'}document.getElementById('days').innerHTML=h;var sr=d.sunrise[0].substr(11,5),ss=d.sunset[0].substr(11,5);document.getElementById('sunrise').innerHTML=sr;document.getElementById('sunset').innerHTML=ss;var a=d.sunrise[0].split('T')[1].split(':'),b=d.sunset[0].split('T')[1].split(':'),m=(+b[0]*60 + +b[1])-(+a[0]*60 + +a[1]);document.getElementById('daylen').innerHTML=Math.floor(m/60)+' ч '+(m%60)+' мин'}catch(e){}}function fetchWeather(){var x=new XMLHttpRequest();x.open('GET','https://adidas717-hub.github.io/ipad-panel/weather.json?v='+(new Date().getTime()),true);x.onreadystatechange=function(){if(x.readyState===4&&x.status>=200&&x.status<300){try{render(JSON.parse(x.responseText))}catch(e){}}};x.send(null)}fetchWeather();setTimeout(fetchWeather,3000);setInterval(fetchWeather,300000);document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(fetchWeather,500)});window.addEventListener('pageshow',function(){setTimeout(fetchWeather,500)});
</script></body></html>
