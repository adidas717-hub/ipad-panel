-size:2.35vw;font-weight:400;line-height:1.05}.small{font-size:1.35vw;opacity:.78}#temp{font-size:8.2vw;line-height:.92;margin:7px 0 5px;font-weight:300}#details{position:absolute;right:17px;top:66px;font-size:1.35vw;line-height:1.65;text-align:left;font-weight:400}#sunmini{position:absolute;left:17px;right:12px;bottom:11px;font-size:1.15vw;opacity:.9;white-space:nowrap;border-top:1px solid rgba(255,255,255,.13);padding-top:8px}#sunmini span{margin-right:15px}#sunmini b{font-size:1.2vw;font-weight:500}#forecast{left:59%;top:38%;width:39%;height:19%;padding:8px 10px}#forecast h3{margin:0 0 4px;font-size:1.25vw;font-weight:400}.fd{float:left;width:20%;text-align:center;font-size:.85vw;border-left:1px solid rgba(255,255,255,.1)}.fd:first-child{border:0}.ico{font-size:1.45vw;margin:2px 0}.hi{font-size:1.2vw}.lo{font-size:.85vw;opacity:.65}#photoWrap{left:59%;top:59%;width:39%;height:39%;padding:3px}#photo{width:100%;height:100%;object-fit:cover;border-radius:10px}.nav{position:absolute;top:42%;width:30px;height:50px;border:0;border-radius:15px;background:rgba(0,0,0,.2);color:#fff;font-size:26px;opacity:.7}.prev{left:8px}.next{right:8px}#mode{position:absolute;z-index:50;right:1.2%;bottom:1.2%;width:38px;height:38px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(40,40,40,.22);color:#fff;font-size:19px;padding:0}#nightTemp{display:none}.night #screen{background:#050505;color:#b87950}.night #left{left:0;top:0;width:100%;height:100%}.night #clockbox{left:0;top:17%;width:100%;height:66%;text-align:center}.night #clock{font-size:27vw;line-height:.82;letter-spacing:-1.4vw;font-weight:200;color:#b87950;text-shadow:0 0 18px rgba(184,121,80,.08)}.night #date{font-size:3.1vw;margin:2.5vh 0 0;color:#9f6748}.night #nightTemp{display:block;font-size:4.2vw;margin-top:3.5vh;color:#9f6748}.night #nightTemp .moon{font-size:4.7vw;margin-right:1.3vw}.night #calendar,.night #weather,.night #forecast,.night #photoWrap{display:none}.night #mode{background:transparent;border-color:rgba(184,121,80,.18);color:#9f6748;opacity:.45}@media (orientation:portrait){#left{left:3%;top:2%;width:94%;height:43%}#clockbox{height:43%}#clock{font-size:26.5vw;letter-spacing:-1.45vw}#date{font-size:3.2vw}#calendar{top:44%;height:56%}#calTitle{font-size:3vw}.cal{font-size:2.2vw}.cal td{height:3.1vh}.today{width:4.7vw;height:4.7vw;line-height:4.7vw;font-size:2.7vw}.holiday{font-size:1.6vw}.holiday b{font-size:2vw}#weather{left:3%;top:47%;width:45%;height:20%}#forecast{left:50%;top:47%;width:47%;height:20%}#photoWrap{left:3%;top:69%;width:94%;height:29%}.night #left{left:0;top:0;width:100%;height:100%}.night #clockbox{top:25%;height:55%}.night #clock{font-size:29vw}.night #date{font-size:4.2vw}.night #nightTemp{font-size:6vw}.night #nightTemp .moon{font-size:6.5vw}}</style></head><body><div id="screen"><div id="left"><div id="clockbox"><div id="clock">--:--</div><div id="date"></div><div id="nightTemp"><span class="moon">☾</span><span id="nightTempValue">--°</span></div></div><div id="calendar" class="card"><div id="calTitle"></div><div id="calBody"></div><div class="holiday">Сегодня<br><b id="holiday">Праздников нет</b></div></div></div><div id="weather" class="card"><div id="city">Ханты-Мансийск</div><div class="small">Сейчас</div><div id="temp">--°</div><div id="feel" class="small"></div><div id="details"></div><div id="sunmini"><span>Восход <b id="rise">--:--</b></span><span>Закат <b id="set">--:--</b></span><span>День <b id="len">--</b></span></div></div><div id="forecast" class="card"><h3>Прогноз на 5 дней</h3><div id="days"></div></div><div id="photoWrap" class="card"><img id="photo" src="photos/photo1.jpg"><button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button></div><button id="mode">☾</button></div><script>var M=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],MC=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],W=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];function p(n){return n<10?'0'+n:n}function cal(d){var y=d.getFullYear(),m=d.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),h='<table class="cal"><tr><th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Вс</th></tr><tr>',i;for(i=0;i<f;i++)h+='<td></td>';for(i=1;i<=n;i++){if((f+i-1)%7===0&&i>1)h+='</tr><tr>';h+='<td>'+(i===d.getDate()?'<span class="today">'+i+'</span>':i)+'</td>'}h+='</tr></table>';document.getElementById('calTitle').innerHTML=MC[m]+' '+y;document.getElementById('calBody').innerHTML=h;var q={'1-1':'Новый год','1-7':'Рождество Христово','2-23':'День защитника Отечества','3-8':'Международный женский день','5-1':'Праздник Весны и Труда','5-9':'День Победы','6-12':'День России','11-4':'День народного единства'};document.getElementById('holiday').innerHTML=q[(m+1)+'-'+d.getDate()]||'Праздников нет'}function tick(){var d=new Date();document.getElementById('clock').innerHTML=p(d.getHours())+':'+p(d.getMinutes());document.getElementById('date').innerHTML=W[d.getDay()]+', '+d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();cal(d)}tick();setInterval(tick,30000);function icon(c){if(c===0)return'☀';if(c<=3)return'🌤';if(c<=48)return'☁';if(c<=67)return'🌧';if(c<=77)return'❄';if(c<=82)return'🌦';return'⛈'}var sunrise='07:00',sunset='19:00',manual=false,manualTimer=null;function mins(s){var a=s.split(':');return parseInt(a[0],10)*60+parseInt(a[1],10)}function setNight(on){document.body.className=on?'night':'';document.getElementById('mode').innerHTML=on?'☀':'☾'}function autoNight(){if(manual)return;var d=new Date(),m=d.getHours()*60+d.getMinutes();setNight(m<mins(sunrise)||m>=mins(sunset))}function render(j){try{var c=j.current,d=j.daily,t=Math.round(c.temperature_2m);document.getElementById('temp').innerHTML=icon(c.weather_code)+' '+t+'°';document.getElementById('nightTempValue').innerHTML=(t>0?'+':'')+t+'°';document.getElementById('feel').innerHTML='Ощущается '+Math.round(c.apparent_temperature)+'°';document.getElementById('details').innerHTML='Влажность '+c.relative_humidity_2m+' %<br>Ветер '+Math.round(c.wind_speed_10m)+' км/ч';var h='',k,dt;for(k=0;k<5;k++){dt=new Date(d.time[k]+'T12:00:00');h+='<div class="fd"><div>'+(k===0?'Сегодня':W[dt.getDay()].substr(0,2))+'</div><div class="ico">'+icon(d.weather_code[k])+'</div><div class="hi">'+Math.round(d.temperature_2m_max[k])+'°</div><div class="lo">'+Math.round(d.temperature_2m_min[k])+'°</div></div>'}document.getElementById('days').innerHTML=h;sunrise=d.sunrise[0].substr(11,5);sunset=d.sunset[0].substr(11,5);document.getElementById('rise').innerHTML=sunrise;document.getElementById('set').innerHTML=sunset;var a=sunrise.split(':'),b=sunset.split(':'),z=(+b[0]*60 + +b[1])-(+a[0]*60 + +a[1]);document.getElementById('len').innerHTML=Math.floor(z/60)+'ч '+z%60+'м';autoNight()}catch(e){}}function weather(){var x=new XMLHttpRequest();x.open('GET','weather.json?t='+new Date().getTime(),true);x.onreadystatechange=function(){if(x.readyState===4&&x.status===200){try{render(JSON.parse(x.responseText))}catch(e){}}};x.send(null)}weather();setInterval(weather,300000);setInterval(autoNight,60000);document.getElementById('mode').onclick=function(){manual=true;if(manualTimer)clearTimeout(manualTimer);setNight(document.body.className!=='night');manualTimer=setTimeout(function(){manual=false;autoNight()},15*60*1000)};var photos=['photos/photo1.jpg','photos/photo2.jpg','photos/photo3.jpg','photos/photo4.jpg','photos/photo5.jpg','photos/photo6.jpg','photos/photo7.jpg','photos/photo8.jpg'],pi=0,im=document.getElementById('photo');function show(n){pi=(n+photos.length)%photos.length;im.src=photos[pi]}document.getElementById('prev').onclick=function(){show(pi-1)};document.getElementById('next').onclick=function(){show(pi+1)};setInterval(function(){show(pi+1)},45000);</script></body></html>
